title: Landing
class: CSCI 0220
name: Discrete Structures and Probability
location_description: CSCI 0220 meets Mondays, Wednesdays, and Fridays from 1:00 - 1:50 pm in Salomon DECI.
main_description: |
    I don't know about you, but we're feeling 22!
    This class, usually offered during the spring semester at Brown University, gives you the tools to explore interesting questions and convince
    yourself and others of their answers. You'll be introduced to new worlds of ideas and ways of
    thinking.
    We'll learn about Set Theory, Logic, Number Theory, Combinatorics, and
    Probability.
    If these topics sound unfamiliar, not to fear—you're in exactly the right place! This course
    assumes
    no prior experience with these topics.
    <br><br>                
                    
theme_description: |
    Important info before the semester starts:
    <ul>
      <li>Exams are in person: March 15 and May 9.</li>
      <li>Lectures will be streamed and recorded; attendance is strongly encouraged but not required.</li>
      <li>Attendance at weekly recitation sections is required.</li>
    </ul>
    This year, we're taking proofs prehistoric! Rawr!
